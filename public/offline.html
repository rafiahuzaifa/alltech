<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050a16">
<title>You're offline | All Tech Cloud Services</title>
<link rel="icon" href="/icon.png">
<style>
  /* Self-contained on purpose: this page must render with no network and no JS bundles. */
  :root { --bg:#ffffff; --card:#f5f7fb; --ink:#0b1220; --muted:#5a6478; --line:#e3e8f2; --brand:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#050a16; --card:#0b1529; --ink:#e8eefb; --muted:#94a3b8; --line:#1b2741; --brand:#60a5fa; } }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100dvh;
         padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 440px; width:100%; text-align:center; }
  .icon { width:72px; height:72px; border-radius:18px; }
  h1 { font-size: clamp(1.8rem, 6vw, 2.4rem); margin: 24px 0 8px; letter-spacing:-0.02em; }
  p { color:var(--muted); line-height:1.6; margin: 0 0 8px; }
  .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:28px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding: 0 22px; border-radius:999px;
         font-weight:600; font-size:15px; text-decoration:none; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .btn.primary { border:0; color:#fff; background: linear-gradient(90deg, #2563eb, #06b6d4); }
  .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .contact { margin-top:32px; font-size:14px; }
  .contact a { color:var(--brand); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<main>
  <img class="icon" src="/icons/icon-192.png" alt="All Tech Cloud Services" width="72" height="72">
  <h1>You're offline</h1>
  <p>This page isn't available without an internet connection. Pages you've visited before may still open, and forms need a connection to send.</p>
  <div class="actions">
    <button class="btn primary" type="button" onclick="location.reload()">Try again</button>
    <a class="btn" href="/">Go to home</a>
  </div>
  <p class="contact">Urgent? Call <a href="tel:+17373045613">+1 (737) 304-5613</a></p>
</main>
<script>
  // Reload automatically as soon as the connection comes back.
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
